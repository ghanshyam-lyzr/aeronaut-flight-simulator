name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aeronaut
          POSTGRES_PASSWORD: aeronaut
          POSTGRES_DB: aeronaut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run all regressions with the WebAssembly engine
        run: npm run test:wasm

      - name: Build
        run: npm run build

      - name: Verify the service against PostgreSQL
        run: npm run test:server
        env:
          DATABASE_URL: postgresql://aeronaut:aeronaut@localhost:5432/aeronaut_test
